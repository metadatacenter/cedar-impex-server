      operationId: threads
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
