# Base OpenAPI document merged into the generated spec by io.swagger.core.v3:swagger-maven-plugin.
# It seeds the info block (version stamped from the POM via resource filtering) and the api_key
# security scheme that every resource class references with @SecurityRequirement(name = "api_key").
openapi: 3.0.1
info:
  title: CEDAR Impex Server API
  description: |
    Better Metadata - Better Science

    Folders and artifacts use type-qualified selectors: `folders/<uuid>`, `templates/<uuid>`,
    `template-elements/<uuid>`, `template-fields/<uuid>`, or `template-instances/<uuid>`.
    Typed routes include the type once, for example `/templates/<uuid>`. Query parameters and
    command-body selectors retain the type, including folder parameters. Percent-encoded full
    IRIs remain accepted for compatibility. Stored document identities and references remain
    full IRIs; legacy repository hosts must remain absolute until their data is migrated.

    The impex server brings metadata into CEDAR from outside it. Today that means caDSR forms:
    XML uploaded in chunks, translated into CEDAR templates, and saved into a folder of the caller's
    choosing.
    
    Translation runs in the background, so an upload returns before the templates exist. The status
    endpoint is how a caller learns what became of each file.
  version: ${project.version}
components:
  schemas:
    CadsrFormUploadChunk:
      type: object
      description: >-
        One chunk of one file, sent as Flow.js sends it. An upload can hold several files, and each
        file arrives as one or more chunks. Every chunk repeats the fields that place it in its file
        and its file in the upload, and a chunk that disagrees with an earlier one is refused. Other
        form fields are ignored.
      required:
        - uploadId
        - numberOfFiles
        - flowIdentifier
        - flowFilename
        - flowRelativePath
        - flowTotalSize
        - flowChunkSize
        - flowTotalChunks
        - flowChunkNumber
        - flowCurrentChunkSize
        - file
      properties:
        uploadId:
          type: string
          description: >-
            Identifies the upload. Every chunk of every file in the upload carries the same value,
            which must be a single path segment. The import status is reported under it.
        numberOfFiles:
          type: integer
          format: int64
          minimum: 1
          description: How many files the upload holds. The import starts once all of them have arrived.
        flowIdentifier:
          type: string
          description: Identifies the file within the upload.
        flowFilename:
          type: string
          description: >-
            The file's name. Any directory part is dropped, and no two files in one upload may have
            the same name.
        flowRelativePath:
          type: string
          description: The file's path on the client. It is required and otherwise unused.
        flowTotalSize:
          type: integer
          format: int64
          minimum: 0
          maximum: 5368709120
          description: The file's size in bytes.
        flowChunkSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 5368709120
          description: The size in bytes of every chunk of the file except the last.
        flowTotalChunks:
          type: integer
          format: int64
          minimum: 1
          description: >-
            How many chunks the file is sent in: its size divided by the chunk size, rounded either
            down or up.
        flowChunkNumber:
          type: integer
          format: int64
          minimum: 1
          description: This chunk's position in the file, counting from 1.
        flowCurrentChunkSize:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The size in bytes of this chunk. It must match the chunk sent, and equals the chunk size
            for every chunk but the last, which holds what remains of the file.
        file:
          type: string
          format: binary
          description: The chunk's bytes, as the request's only file part.
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
